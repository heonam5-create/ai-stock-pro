name: APK 자동 빌드

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_OWN_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          # 기본값('tools')은 더 이상 존재하지 않는 패키지라 실패하므로 명시
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 서명키 복원 (GitHub Secrets)
        if: ${{ env.HAS_OWN_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 서명키 없음 안내
        if: ${{ env.HAS_OWN_KEY != 'true' }}
        run: echo "::warning::KEYSTORE_BASE64 시크릿이 없어 임시 디버그 키로 서명합니다. 업데이트 설치(데이터 유지)를 하려면 서명키 시크릿을 등록하세요."

      - name: 분석 엔진 단위 테스트
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: APK 빌드
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AIStockPRO-v1.0.${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: APK 업로드 (Actions 탭 > Artifacts 에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Stock-PRO-APK
          path: out/*.apk

      - name: 릴리스 페이지에 APK 게시 (휴대폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AI 주식 분석센터 PRO v1.0.${{ github.run_number }}
          body: "휴대폰에서 아래 APK 파일을 눌러 내려받은 뒤 설치하세요."
          prerelease: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          files: out/*.apk
