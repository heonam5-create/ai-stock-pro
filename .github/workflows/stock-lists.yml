name: 종목 목록 갱신

on:
  schedule:
    - cron: '17 21 * * 0'     # 매주 월요일 06:17 KST
  workflow_dispatch: {}
  push:
    branches: [ 'claude/**' ]
    paths: [ 'tools/stocklists/**', '.github/workflows/stock-lists.yml' ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 목록 생성 (KRX 공식 + 네이버 + Nasdaq Trader)
        run: python3 tools/stocklists/build_lists.py data ios/AIStockCore/Sources/AIStockCore/Resources
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ios/AIStockCore/Sources/AIStockCore/Resources
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 한국·미국 종목 목록 갱신"
          git push
