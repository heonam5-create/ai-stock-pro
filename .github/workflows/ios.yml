name: iOS 빌드·테스트

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 코어(분석·시세·검색) 컴파일·단위 테스트
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 정보
        run: xcodebuild -version && swift --version
      - name: 단위 테스트
        working-directory: ios/AIStockCore
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-test.log
          grep -E "Executed|error:" ../../core-test.log | tail -5
      - name: 실제 시세 검증 (네이버 기본 · Yahoo 교차검증, 참고용)
        continue-on-error: true
        working-directory: ios/AIStockCore
        env:
          LIVE_QUOTE_TEST: '1'
          LIVE_QUOTE_OUT: ${{ runner.temp }}/live-ios.md
        run: |
          swift test --filter LiveQuoteTests
          if [ -f "$LIVE_QUOTE_OUT" ]; then { echo "## iOS 실제 시세 검증"; cat "$LIVE_QUOTE_OUT"; } >> "$GITHUB_STEP_SUMMARY"; fi
